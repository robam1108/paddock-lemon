<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <!-- Paddock 하루 일정표(KST) — 프로젝트에서 직접 그린 도식. 시각은 안내 문단과 같다. -->
  <rect width="640" height="900" fill="#14161a"/>
  <rect x="16" y="16" width="608" height="868" fill="none" stroke="#3a3f47" stroke-width="3"/>
  <text x="40" y="74" fill="#c9a86a" font-size="34" font-weight="600">하루 일정 (KST)</text>

  <!-- 시간 축: 00시 y=130, 시간당 30px → 24시 y=850 -->
  <line x1="130" y1="130" x2="130" y2="850" stroke="#3a3f47" stroke-width="4"/>
  <g fill="#6c727b" font-size="22" text-anchor="end">
    <text x="112" y="138">00:00</text>
    <text x="112" y="318">06:00</text>
    <text x="112" y="498">12:00</text>
    <text x="112" y="678">18:00</text>
    <text x="112" y="858">24:00</text>
  </g>

  <!-- 미션 13:00~19:00 띠 -->
  <rect x="134" y="520" width="18" height="180" fill="#c9a86a" opacity="0.55"/>

  <g font-size="28">
    <circle cx="130" cy="130" r="9" fill="#e6e8eb"/>
    <text x="172" y="140" fill="#e6e8eb">하루 횟수 초기화</text>

    <circle cx="130" cy="310" r="9" fill="#8a9099"/>
    <text x="172" y="320" fill="#8a9099">월요일만 · 룸 재배치</text>

    <circle cx="130" cy="370" r="9" fill="#e6e8eb"/>
    <text x="172" y="380" fill="#e6e8eb">도시락</text>

    <circle cx="130" cy="430" r="11" fill="#c9a86a"/>
    <text x="172" y="440" fill="#f1dfb6" font-weight="600">경마 1경주 발주</text>

    <circle cx="130" cy="490" r="9" fill="#e6e8eb"/>
    <text x="172" y="500" fill="#e6e8eb">도시락</text>

    <text x="172" y="572" fill="#c9b78f">일일 미션 13:00 ~ 19:00</text>
    <text x="172" y="610" fill="#8a9099" font-size="24">하루 2회 · 2시간 간격</text>

    <circle cx="130" cy="700" r="9" fill="#e6e8eb"/>
    <text x="172" y="710" fill="#e6e8eb">도시락</text>

    <circle cx="130" cy="790" r="11" fill="#c9a86a"/>
    <text x="172" y="800" fill="#f1dfb6" font-weight="600">경마 2경주 발주</text>
  </g>
</svg>
