<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <!-- Paddock 장소 안내도 — 프로젝트에서 직접 그린 도식. 번호는 안내 문단(¹~⁶)과 같다. -->
  <rect width="640" height="820" fill="#14161a"/>
  <rect x="16" y="16" width="608" height="788" fill="none" stroke="#3a3f47" stroke-width="3"/>
  <text x="40" y="74" fill="#c9a86a" font-size="34" font-weight="600">장소 안내</text>

  <!-- 통로 -->
  <g stroke="#2c3036" stroke-width="14">
    <line x1="320" y1="250" x2="320" y2="300"/>
    <line x1="320" y1="500" x2="320" y2="550"/>
    <line x1="170" y1="400" x2="200" y2="400"/>
  </g>

  <g stroke="#3a3f47" stroke-width="3" fill="#1c1f24">
    <rect x="40" y="110" width="270" height="140"/>   <!-- 라운지 -->
    <rect x="330" y="110" width="270" height="140"/>  <!-- 식당 -->
    <rect x="40" y="340" width="130" height="120"/>   <!-- 수돗가 -->
    <rect x="40" y="550" width="270" height="140"/>   <!-- 공방 -->
    <rect x="330" y="550" width="270" height="140"/>  <!-- 휴게실 -->
  </g>
  <rect x="200" y="300" width="400" height="200" fill="#2a2418" stroke="#c9a86a" stroke-width="3"/>  <!-- 광장 -->

  <g fill="#e6e8eb" font-size="32" font-weight="600">
    <text x="60" y="160">¹ 라운지</text>
    <text x="350" y="160">³ 식당</text>
    <text x="54" y="408" font-size="26">² 수돗가</text>
    <text x="60" y="600">⁵ 공방</text>
    <text x="350" y="600">⁶ 휴게실</text>
    <text x="400" y="390" text-anchor="middle" fill="#f1dfb6">⁴ 광장</text>
  </g>
  <g fill="#8a9099" font-size="24">
    <text x="60" y="200">공용 공간 · 탐험</text>
    <text x="350" y="200">도시락 · 탐험</text>
    <text x="60" y="640">일일 미션</text>
    <text x="350" y="640">에너지 바닥 · 휴식</text>
    <text x="400" y="430" text-anchor="middle" fill="#c9b78f">단체 채팅방</text>
    <text x="400" y="464" text-anchor="middle" fill="#c9b78f">교류와 거래</text>
  </g>
  <text x="40" y="760" fill="#5c626b" font-size="22">도식이며 실제 거리 · 크기와 무관합니다.</text>
</svg>
