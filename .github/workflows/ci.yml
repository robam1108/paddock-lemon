name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # DB 없이 도는 검사 — 정적 분석, 단위 테스트, 빌드
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: check-theme (원본 콘셉트 잔재 0건)
        run: bash scripts/check-theme.sh
      - run: npm test
      - name: build
        run: npm run build
        env:
          # 빌드만 확인한다. 실제 연결 값은 db 작업에서 로컬 스택 기준으로 다시 넣는다.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only

  # 로컬 Supabase 스택 위에서 도는 검사 — pgTAP, 픽스처 일치, E2E
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: supabase start (마이그레이션 + seed)
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - name: pgTAP (supabase test db)
        run: npx supabase test db

      - name: 단위 테스트 픽스처가 서버 get_rules() 와 같은지
        run: node scripts/fixtures.mjs --check

      - name: 앱 환경 변수(로컬 스택)
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
          } > .env.local

      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E (로그인 → 경마 베팅 → 결과)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
